name = "Saw38a"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Saw38a"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib c55e6e786f49 (lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Saw38a"
roots = ["Saw38a"]

# The checker (core Lean only), compiled to native code for native_decide.
[[lean_lib]]
name = "Saw38aCore"
globs = ["Saw38aCore", "Saw38aCore.+"]
precompileModules = true

# Build-time loader of the certificate data (7-bit string chunks with FNV-1a pins).
[[lean_lib]]
name = "L38Loader"
precompileModules = true

# The certificate data (generated by tools/gen_data28f.sh), compiled to native code.
[[lean_lib]]
name = "L38Data"
globs = ["L38Data", "L38Data.+"]
precompileModules = true
# about 180 GB of string data: the medium code model addresses large data sections with 64-bit offsets.
moreLeancArgs = ["-mcmodel=medium"]

# The native_decide shard theorems (generated by tools/gen_shards28f.py).
[[lean_lib]]
name = "L38Shard"
globs = ["L38Shard.+"]
